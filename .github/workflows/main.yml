name: 🚀 Validate, test and deploy to production

on:
  push:
    branches:
      - master

env:
  PHP_VERSION_REQUIRED: 8.4

jobs:
  validate:
    name: 🔧 Run analysis and tests
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_DEV: 0
    steps:
      - name: 🚚 Download latest code
        uses: actions/checkout@v4

      - name: 🚚 Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION_REQUIRED }}
          extensions: mbstring, exif

      - name: 🚚 Install Composer development dependencies
        working-directory: ./
        run: composer install

      - name: 🚀 Run PHPStan analysis
        run: vendor/bin/phpstan analyse --configuration phpstan.neon --memory-limit 512M --no-progress

      - name: 🚀 Run PHPUnit tests (without requests)
        run: vendor/bin/phpunit --configuration phpunit.xml --exclude-group request,no-github-action

  web-deploy:
    name: 🎉 Deploy on production
    needs: [ validate ]
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_DEV: 1
    steps:
      - name: 🚚 Download latest code
        uses: actions/checkout@v4

      - name: 🚚 Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION_REQUIRED }}
          extensions: mbstring, exif

      - name: 🚚 Install Composer production dependencies
        working-directory: ./
        run: composer install

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: ${{ secrets.ftp_server_dir }}
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            data/config.local.example.neon
            asset/
            asset/**
            temp/**
            tests/
            tests/**
            composer.json
            composer.lock
            readme.md
            web.config
            LICENSE
            README.md
            phpstan.neon
            phpstan-baseline.neon
            phpunit.xml

      - name: 🧹 Post deploy script - run
        id: postdeployscript
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://better-location.palider.cz/post-deploy.php?password=${{ secrets.SCRIPT_PASSWORD }}'
          method: 'DELETE'
          timeout: 20000

      - name: 🧹 Post deploy script - show output
        run: |
          echo ${{ steps.postdeployscript.outputs.headers }}
          echo ${{ steps.postdeployscript.outputs.response }}
